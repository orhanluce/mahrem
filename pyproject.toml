[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mahrem-local"
version = "0.1.0"
description = "Local-first PII masking MCP server for Turkish documents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Orhan" }]
keywords = ["mcp", "privacy", "pii", "redaction", "turkish"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["mcp>=2.0,<3"]

[project.scripts]
mahrem = "mahrem.cli:main"
mahrem-mcp = "mahrem.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mahrem"]
